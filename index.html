<meta name="theme-color" content="#060c09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f8f6" media="(prefers-color-scheme: light)">
<script>
  /* Before first paint: a theme applied in React would flash the default
     for one frame. Reads the saved choice, falls back to the OS. */
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = saved || system;
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
